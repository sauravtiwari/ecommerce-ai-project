# Render Blueprint -- backend service definition, versioned with the code.
# Postgres is hosted separately on Neon.

services:
  - type: web
    name: ecommerce-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    # --host 0.0.0.0 is required: a container bound to loopback is unreachable
    # from Render's proxy. $PORT is assigned at runtime and must not be hardcoded.
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    # Gates the deploy -- and since /health queries Postgres, a bad DATABASE_URL
    # fails the release instead of shipping a broken service.
    healthCheckPath: /health

    envVars:
      - key: ENVIRONMENT
        value: production

      # sync: false = prompt in the dashboard, never store a value in this file.
      # This file is committed to GitHub.
      - key: DATABASE_URL
        sync: false

      # Your Vercel URL, no trailing slash (the Origin header never has one).
      - key: CORS_ORIGINS
        sync: false

      - key: PYTHON_VERSION
        value: "3.13.14"
